<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep-Browser Co-Pilot</title>
    <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
    <div class="sidepanel-container">
        <!-- Top Bar -->
        <header class="sidepanel-header">
            <div class="brand">
                <span class="logo-icon">🌐</span>
                <span class="brand-name">Deep-Browser</span>
            </div>
            <div class="header-pills">
                <span id="agent-state-pill" class="pill state-idle">IDLE</span>
                <span id="connection-pill" class="pill status-offline">OFFLINE</span>
            </div>
        </header>

        <!-- Session & Context Bar -->
        <div class="context-card">
            <div class="context-row">
                <div class="context-item">
                    <span class="context-label">SESSION</span>
                    <span id="session-display" class="context-value">EXT-001 · Current Tab</span>
                </div>
                <div class="context-item model-item">
                    <span class="context-label">MODEL</span>
                    <select id="model-select" class="compact-select">
                        <option value="gemini-3.5-flash-lite" selected>Gemini 3.5 Flash</option>
                    </select>
                </div>
            </div>

            <div class="tab-chip">
                <span class="tab-icon">📍</span>
                <div class="tab-details">
                    <span id="tab-title" class="tab-title-text">Loading active tab...</span>
                    <span id="tab-url" class="tab-url-text">-</span>
                </div>
                <div class="tab-actions">
                    <button id="btn-send-to-workspace" class="btn-handoff" title="Handoff session to Desktop Workspace">🚀 Send to Workspace</button>
                </div>
            </div>
        </div>

        <!-- Challenge Banner -->
        <div id="challenge-banner" class="challenge-banner hidden">
            <div class="challenge-header">
                <span class="challenge-icon">🛡️</span>
                <span class="challenge-title">Verification Required</span>
            </div>
            <div id="challenge-text" class="challenge-desc">Cloudflare verification detected.</div>
            <button id="btn-focus-tab" class="btn btn-sm btn-challenge">🔍 Focus Tab</button>
        </div>

        <!-- Safe Mode Modal -->
        <div id="confirmation-modal" class="confirmation-modal hidden">
            <div class="modal-card">
                <div class="modal-badge">⚠️ SAFE MODE GATEWAY</div>
                <h3>Action Confirmation</h3>
                <div class="modal-field">
                    <span class="field-label">Action:</span>
                    <span id="modal-action-text" class="field-val">-</span>
                </div>
                <div class="modal-field">
                    <span class="field-label">Target:</span>
                    <span id="modal-target-text" class="field-val highlight">-</span>
                </div>
                <div class="modal-actions">
                    <button id="btn-confirm-action" class="btn btn-confirm">Confirm</button>
                    <button id="btn-reject-action" class="btn btn-reject">Reject</button>
                </div>
            </div>
        </div>

        <!-- Real-Time Chat & Action Timeline Feed -->
        <div class="timeline-container">
            <div id="sidepanel-feed" class="sidepanel-feed">
                <div class="empty-state">
                    <span class="empty-icon">🤖</span>
                    <span class="empty-title">Deep-Browser Ready</span>
                    <span class="empty-desc">Ask anything on the current active tab.</span>
                </div>
            </div>
        </div>

        <!-- Composer & Controls -->
        <div class="composer-section">
            <div class="controls-bar">
                <button id="btn-pause-agent" class="btn btn-secondary btn-xs" disabled>⏸ Pause</button>
                <button id="btn-resume-agent" class="btn btn-secondary btn-xs hidden">⏯ Resume</button>
                <button id="btn-stop-agent" class="btn btn-danger btn-xs" disabled>⏹ Stop</button>
                <button id="btn-clear-timeline" class="btn btn-secondary btn-xs" title="Clear chat">🗑️ Clear</button>
            </div>
            <div class="input-wrapper">
                <textarea id="sidepanel-goal" placeholder="Ask the agent... (e.g. Kerjakan halaman ini)" rows="2"></textarea>
                <button id="submit-goal-btn" class="btn btn-primary btn-send">▶</button>
            </div>
        </div>
    </div>
    <script src="sidepanel.js"></script>
</body>
</html>
