name: Capture Readme Media

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/capture-readme-media.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install browser and image tools
        run: |
          npm ci --prefix extension
          npm install --prefix extension --no-save --package-lock=false playwright
          cd extension && npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Build extension UI
        run: npm run build --prefix extension

      - name: Capture white theme, high-resolution panel, and simulated agent demo
        shell: bash
        run: |
          set -euo pipefail
          npm run dev --prefix extension -- --host 127.0.0.1 > /tmp/deep-browser-vite.log 2>&1 &
          cd extension

          node --input-type=module <<'NODE'
          let ready = false;
          for (let i = 0; i < 90; i++) {
            try {
              const response = await fetch('http://127.0.0.1:5173/');
              if (response.ok) { ready = true; break; }
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 1000));
          }
          if (!ready) throw new Error('Vite did not become ready.');
          NODE

          mkdir -p ../docs/images /tmp/deep-browser-frames

          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          const base = 'http://127.0.0.1:5173/';
          const pause = ms => new Promise(resolve => setTimeout(resolve, ms));

          async function openUi(width, height, deviceScaleFactor = 1, theme = 'dark') {
            const page = await browser.newPage({
              viewport: { width, height },
              deviceScaleFactor,
              colorScheme: theme,
            });
            page.on('pageerror', error => console.error('[UI page error]', error.message));
            await page.goto(base, { waitUntil: 'networkidle', timeout: 60000 });
            await page.locator('.app').waitFor({ state: 'visible', timeout: 30000 });
            if (await page.getByText('Sidepanel Mengalami Kendala').count()) {
              throw new Error('The application rendered its error screen.');
            }
            const currentTheme = await page.locator('html').getAttribute('data-theme');
            if (currentTheme !== theme) {
              await page.getByRole('button', { name: 'Toggle theme' }).click();
              await page.waitForFunction(expected => document.documentElement.getAttribute('data-theme') === expected, theme);
            }
            await page.evaluate(() => document.fonts.ready);
            await pause(500);
            return page;
          }

          // White theme screenshot: same actual UI, no mock layout or image filter.
          const light = await openUi(1440, 960, 2, 'light');
          await light.screenshot({
            path: '../docs/images/chatbot-full-light.png',
            animations: 'disabled',
          });
          await light.close();

          // High-DPI sidepanel capture: preserve fine text at a narrow 420 CSS-pixel viewport.
          const panel = await openUi(420, 900, 3, 'dark');
          await panel.screenshot({
            path: '../docs/images/chatbot-sidepanel-dark.png',
            animations: 'disabled',
          });
          await panel.close();

          // Simulated agent flow: seed test-only data into the real chat components for this capture.
          const demo = await openUi(1440, 900, 1, 'dark');
          await demo.evaluate(async () => {
            const { sidepanelStore } = await import('/src/state/sidepanelStore.ts');
            const store = sidepanelStore;
            const state = store.getState();
            const now = Date.now();

            state.currentView = 'chat';
            state.isInspectorOpen = false;
            state.connectionStatus = 'standalone';
            state.runState = 'idle';
            state.stepCount = 0;

            const session = {
              id: 'readme-demo-session',
              name: 'Security advisory research (simulated)',
              createdAt: now,
              updatedAt: now,
              messages: [],
              events: [],
            };
            state.sessions = [session];
            state.activeSessionId = session.id;

            const userMessage = {
              id: 'demo-user-prompt',
              role: 'user',
              text: 'Research the latest Chromium security advisories. Compare official sources, identify affected versions, and prepare a concise report. Do not submit forms or change website data.',
              timestamp: now,
            };

            const step1 = {
              id: 'demo-step-1',
              name: 'Open official Chromium release notes',
              icon: 'compass',
              status: 'succeeded',
              args: { url: 'https://chromereleases.googleblog.com/', purpose: 'Locate official stable release information' },
              result: { source: 'Official Chromium Blog', status: 'opened (simulated)' },
              verification: { passed: true, evidence: 'Source label matched the expected official domain (demo fixture)' },
              duration: '1.2s',
              timestamp: now + 800,
            };
            const step2 = {
              id: 'demo-step-2',
              name: 'Search official security advisories',
              icon: 'search',
              status: 'succeeded',
              args: { query: 'Chromium stable channel security fixes', scope: 'official sources only' },
              result: { matches: 3, sources: ['Chromium Blog', 'Chrome Releases'], status: 'results staged (simulated)' },
              verification: { passed: true, evidence: 'Three fixture records available for comparison' },
              duration: '2.4s',
              timestamp: now + 2100,
            };
            const step3 = {
              id: 'demo-step-3',
              name: 'Compare affected versions',
              icon: 'terminal',
              status: 'running',
              args: { fields: ['release date', 'affected versions', 'fixed version'], deduplicate: true },
              timestamp: now + 3400,
            };
            const step4 = {
              id: 'demo-step-4',
              name: 'Verify evidence and prepare summary',
              icon: 'check',
              status: 'running',
              args: { requireOfficialSource: true, requireVersionMatch: true },
              timestamp: now + 4300,
            };

            const assistantMessage = {
              id: 'demo-assistant-result',
              role: 'assistant',
              text: '',
              timestamp: now + 500,
              modelName: 'Gemini · Demo Fixture',
              duration: '6.8s',
              steps: [step1, step2, step3, step4],
              activities: [
                { id: 'demo-narrative-1', type: 'narrative', text: 'I’ll compare official release notes, cross-check the version details, and keep the final report limited to evidence represented in this demo.', timestamp: now + 600 },
                { id: 'demo-reasoning-1', type: 'reasoning', thought: 'Plan: locate official release notes, compare the listed versions, then verify that the report is internally consistent. This is illustrative demo text, not a live model thought trace.', timestamp: now + 700 },
                { id: 'demo-activity-1', type: 'step', step: step1, timestamp: now + 800 },
                { id: 'demo-activity-2', type: 'step', step: step2, timestamp: now + 2100 },
                { id: 'demo-activity-3', type: 'step', step: step3, timestamp: now + 3400 },
                { id: 'demo-activity-4', type: 'step', step: step4, timestamp: now + 4300 },
              ],
              judgeVerdict: undefined,
            };

            session.messages = [userMessage, assistantMessage];
            session.events = [
              { id: 'demo-event-1', timestamp: now + 900, type: 'success', category: 'tools', message: 'Official release source recorded (simulated)', step: 1, runId: 'DEMO-042', sessionId: session.id },
              { id: 'demo-event-2', timestamp: now + 2200, type: 'success', category: 'observations', message: 'Three sample records prepared for comparison (simulated)', step: 2, runId: 'DEMO-042', sessionId: session.id },
              { id: 'demo-event-3', timestamp: now + 4900, type: 'info', category: 'verifications', message: 'Cross-source verification pending (simulated)', step: 4, runId: 'DEMO-042', sessionId: session.id },
            ];

            window.__deepBrowserDemoStore = store;
            store.notify();
          });

          await pause(800);
          const frame = async (name, target = { x: 825, y: 610 }) => {
            await demo.evaluate(({ x, y }) => {
              const old = document.getElementById('readme-demo-overlay');
              if (old) old.remove();

              const overlay = document.createElement('div');
              overlay.id = 'readme-demo-overlay';
              overlay.innerHTML = `
                <div class="demo-vignette"></div>
                <div class="demo-caption">SIMULATED AGENT DEMO <span>· NO LIVE BROWSER ACTIONS</span></div>
                <div class="demo-lens"><div class="demo-lens-copy"></div></div>
                <div class="demo-cursor"><i></i></div>`;
              const style = document.createElement('style');
              style.textContent = `
                #readme-demo-overlay { position:fixed; inset:0; z-index:99990; pointer-events:none; font-family:Inter,Arial,sans-serif; }
                .demo-vignette { position:absolute; inset:0; background:radial-gradient(ellipse at 48% 45%,transparent 30%,rgba(0,0,0,.12) 70%,rgba(0,0,0,.58) 112%); backdrop-filter:blur(.15px); }
                .demo-caption { position:absolute; z-index:4; top:18px; right:22px; color:#f2ede7; background:rgba(11,12,13,.84); border:1px solid rgba(255,255,255,.16); border-radius:5px; padding:7px 10px; font-size:9px; font-weight:750; letter-spacing:1.4px; box-shadow:0 8px 28px rgba(0,0,0,.22); }
                .demo-caption span { color:#b3b4b4; font-weight:500; letter-spacing:.65px; }
                .demo-lens { position:absolute; z-index:3; width:218px; height:218px; left:0; top:0; overflow:hidden; border-radius:50%; border:2px solid rgba(244,243,239,.9); box-shadow:0 0 0 5px rgba(235,231,223,.08),0 18px 48px rgba(0,0,0,.62),inset 0 0 14px rgba(255,255,255,.14); background:#090a0b; }
                .demo-lens-copy { position:absolute; transform-origin:top left; pointer-events:none; }
                .demo-lens-copy .app { min-height:0 !important; }
                .demo-cursor { position:absolute; z-index:5; width:18px; height:18px; border:1px solid rgba(255,255,255,.95); border-radius:50%; background:rgba(224,120,94,.5); box-shadow:0 0 0 5px rgba(224,120,94,.16),0 4px 12px rgba(0,0,0,.5); }
                .demo-cursor i { position:absolute; width:4px; height:4px; border-radius:50%; background:white; left:6px; top:6px; }
              `;
              overlay.appendChild(style);
              document.body.appendChild(overlay);

              const lensSize = 218;
              const zoom = 1.58;
              const lens = overlay.querySelector('.demo-lens');
              const copyWrap = overlay.querySelector('.demo-lens-copy');
              const source = document.querySelector('.app');
              const clone = source.cloneNode(true);
              clone.style.width = window.innerWidth + 'px';
              clone.style.height = window.innerHeight + 'px';
              clone.style.minHeight = '0';
              copyWrap.style.width = window.innerWidth + 'px';
              copyWrap.style.height = window.innerHeight + 'px';
              copyWrap.style.transform = `scale(${zoom})`;
              copyWrap.style.left = (lensSize / 2 - x * zoom) + 'px';
              copyWrap.style.top = (lensSize / 2 - y * zoom) + 'px';
              copyWrap.appendChild(clone);
              lens.style.left = (x - lensSize / 2) + 'px';
              lens.style.top = (y - lensSize / 2) + 'px';
              const cursor = overlay.querySelector('.demo-cursor');
              cursor.style.left = (x + 22) + 'px';
              cursor.style.top = (y + 25) + 'px';
            }, target);
            await pause(850);
            await demo.screenshot({ path: `/tmp/deep-browser-frames/${name}.png`, animations: 'disabled' });
          };

          await frame('01-welcome', { x: 740, y: 555 });

          // Prompt + running browser steps.
          await demo.evaluate(() => {
            const store = window.__deepBrowserDemoStore;
            const state = store.getState();
            state.runState = 'running';
            state.stepCount = 1;
            store.getState().sessions[0].messages[1].text = '';
            store.notify();
          });
          await frame('02-reasoning', { x: 810, y: 565 });

          await demo.evaluate(() => {
            const store = window.__deepBrowserDemoStore;
            const state = store.getState();
            const msg = state.sessions[0].messages[1];
            msg.steps[2].status = 'succeeded';
            msg.steps[2].result = { comparedRecords: 3, versionFields: ['release date', 'affected versions', 'fixed version'], status: 'compared (simulated)' };
            msg.activities.find(a => a.id === 'demo-activity-3').step = msg.steps[2];
            state.stepCount = 3;
            state.isInspectorOpen = true;
            state.sessions[0].events.push({ id: 'demo-event-4', timestamp: Date.now(), type: 'success', category: 'verifications', message: 'Version fields aligned across fixtures (simulated)', step: 3, runId: 'DEMO-042', sessionId: state.sessions[0].id });
            store.notify();
          });
          await frame('03-tool-calls', { x: 965, y: 590 });

          // Expand the dummy reasoning trace and tool payload for the cinematic close-up.
          const reasoning = demo.locator('.trace-item-trigger').filter({ hasText: 'Plan: locate official release notes' }).first();
          if (await reasoning.count()) await reasoning.click();
          const tools = demo.locator('.trace-item-trigger').filter({ hasText: 'Open official Chromium release notes' }).first();
          if (await tools.count()) await tools.click();
          await frame('04-magnified-evidence', { x: 795, y: 545 });

          // Final simulated answer and verification, still clearly marked as a demo.
          await demo.evaluate(() => {
            const store = window.__deepBrowserDemoStore;
            const state = store.getState();
            const msg = state.sessions[0].messages[1];
            msg.steps.forEach((step, i) => {
              step.status = 'succeeded';
              if (!step.result) step.result = { status: 'completed (simulated)' };
              step.duration ||= ['1.2s','2.4s','1.8s','1.4s'][i];
            });
            msg.activities.forEach(activity => {
              if (activity.type === 'step') activity.step = msg.steps.find(step => step.id === activity.step.id);
            });
            msg.text = '## Research summary\n\nThe sample sources have been compared and the key version fields aligned. In a real run, this section would include the verified advisory identifiers, affected versions, fixed versions, and source links.\n\n**Demo status:** all evidence and tool results shown here are fictional fixtures for this animation.';
            msg.judgeVerdict = { verdict: true, score: 0.96, confidence: 0.94, reasoning: 'The sample output contains the requested sections and source labels (simulated validation only).', task: 'Compare official Chromium advisories', finalResult: 'Report structure verified in demo fixture', model: 'Demo Validator' };
            state.runState = 'done';
            state.stepCount = 4;
            state.isInspectorOpen = false;
            state.sessions[0].events.push({ id: 'demo-event-final', timestamp: Date.now(), type: 'success', category: 'verifications', message: 'Demo report structure verified; no live web request was executed.', step: 4, runId: 'DEMO-042', sessionId: state.sessions[0].id });
            store.notify();
          });
          await pause(700);
          const master = demo.locator('.chat-trace-master-trigger').first();
          if (await master.count()) await master.click();
          await frame('05-verified-summary', { x: 820, y: 600 });

          await browser.close();
          NODE

          {
            for frame in /tmp/deep-browser-frames/0*.png; do
              printf "file '%s'\n" "$frame"
              printf "duration 1.25\n"
            done
            printf "file '/tmp/deep-browser-frames/05-verified-summary.png'\n"
          } > /tmp/deep-browser-frames/sequence.txt

          ffmpeg -y -f concat -safe 0 -i /tmp/deep-browser-frames/sequence.txt \
            -vf "fps=10,scale=1000:-1:flags=lanczos,split[s0][s1];[s0]palettegen=max_colors=128[p];[s1][p]paletteuse=dither=bayer" \
            -loop 0 ../docs/images/agent-demo.gif

      - name: Commit media assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/chatbot-full-light.png docs/images/chatbot-sidepanel-dark.png docs/images/agent-demo.gif
          git commit -m "docs: add white theme, sharper sidepanel, and simulated agent demo [skip media]"
          git push
