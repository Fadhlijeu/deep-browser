name: Capture Chatbot UI Screenshot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/capture-chatbot-screenshot.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install extension dependencies
        run: |
          npm ci --prefix extension
          npm install --prefix extension --no-save --package-lock=false playwright

      - name: Install Chromium
        run: cd extension && npx playwright install --with-deps chromium

      - name: Build the real sidepanel UI
        run: npm run build --prefix extension

      - name: Capture the rendered UI
        run: |
          cd extension
          npm run dev -- --host 127.0.0.1 > /tmp/deep-browser-vite.log 2>&1 &
          echo $! > /tmp/deep-browser-vite.pid
          npx wait-on http://127.0.0.1:5173 || (cat /tmp/deep-browser-vite.log && exit 1)
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { mkdir } from 'node:fs/promises';

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({
            viewport: { width: 1440, height: 960 },
            deviceScaleFactor: 1
          });

          page.on('pageerror', error => console.error('[UI page error]', error.message));
          await page.goto('http://127.0.0.1:5173/', { waitUntil: 'networkidle', timeout: 60000 });
          await page.locator('.app').waitFor({ state: 'visible', timeout: 30000 });
          await page.waitForTimeout(1200);

          const failed = await page.getByText('Sidepanel Mengalami Kendala').count();
          if (failed) throw new Error('The sidepanel rendered its error screen; refusing to publish a broken screenshot.');

          await page.evaluate(() => document.fonts.ready);
          await mkdir('../docs/images', { recursive: true });
          await page.screenshot({
            path: '../docs/images/chatbot-ui.png',
            fullPage: true,
            animations: 'disabled'
          });

          await browser.close();
          NODE

      - name: Commit screenshot to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/chatbot-ui.png
          git commit -m "docs: add rendered chatbot UI screenshot [skip capture]"
          git push
