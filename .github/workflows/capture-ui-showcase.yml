name: Capture Deep-Browser UI Showcase

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/capture-ui-showcase.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install UI and browser dependencies
        run: |
          npm ci --prefix extension
          npm install --prefix extension --no-save --package-lock=false playwright
          cd extension && npx playwright install --with-deps chromium

      - name: Build extension UI
        run: npm run build --prefix extension

      - name: Render screenshots and demo GIF
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)

          npm run dev --prefix extension -- --host 127.0.0.1 > /tmp/deep-browser-vite.log 2>&1 &
          echo $! > /tmp/deep-browser-vite.pid

          node --input-type=module <<'NODE'
          const url = 'http://127.0.0.1:5173/';
          let ready = false;
          for (let i = 0; i < 90; i++) {
            try {
              const r = await fetch(url);
              if (r.ok) { ready = true; break; }
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 1000));
          }
          if (!ready) {
            const { readFile } = await import('node:fs/promises');
            console.error(await readFile('/tmp/deep-browser-vite.log', 'utf8'));
            throw new Error('Vite did not become ready.');
          }
          NODE

          mkdir -p docs/images /tmp/deep-browser-frames

          cd extension
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const base = 'http://127.0.0.1:5173/';
          const browser = await chromium.launch({ headless: true });
          const wait = (ms = 500) => new Promise(resolve => setTimeout(resolve, ms));

          async function openUi(width, height) {
            const page = await browser.newPage({
              viewport: { width, height },
              deviceScaleFactor: 1,
              colorScheme: 'dark',
            });
            page.on('pageerror', error => console.error('[UI page error]', error.message));
            await page.goto(base, { waitUntil: 'networkidle', timeout: 60000 });
            await page.locator('.app').waitFor({ state: 'visible', timeout: 30000 });
            const crash = await page.getByText('Sidepanel Mengalami Kendala').count();
            if (crash) throw new Error('UI error boundary rendered; refusing to publish screenshots.');
            const themeButton = page.getByRole('button', { name: 'Toggle theme' });
            if (await page.locator('html').getAttribute('data-theme') !== 'dark') {
              await themeButton.click();
            }
            await page.waitForFunction(() => document.documentElement.getAttribute('data-theme') === 'dark');
            await wait(700);
            return page;
          }

          // Full desktop-sized extension workspace, using the actual dark theme.
          const full = await openUi(1440, 960);
          await full.screenshot({
            path: '../docs/images/chatbot-full-dark.png',
            animations: 'disabled',
          });

          // Chrome Side Panel-sized viewport; CSS naturally switches to compact navigation.
          const side = await openUi(420, 900);
          await side.screenshot({
            path: '../docs/images/chatbot-sidepanel-dark.png',
            animations: 'disabled',
          });
          await side.close();

          // Short interaction reel made from real rendered states of the same UI.
          const demo = await openUi(1440, 900);
          const frame = async name => {
            await wait(750);
            await demo.screenshot({
              path: `/tmp/deep-browser-frames/${name}.png`,
              animations: 'disabled',
            });
          };

          await frame('01-chat');
          await demo.getByRole('button', { name: 'Toggle execution inspector' }).click();
          await demo.locator('.chat-inspector').waitFor({ state: 'visible', timeout: 5000 });
          await frame('02-inspector');
          await demo.locator('.nav-btn[title="Sessions"]').click();
          await frame('03-sessions');
          await demo.locator('.nav-btn[title="Activity & Runs"]').click();
          await frame('04-activity');
          await demo.locator('.nav-btn[title="Chat"]').click();
          await demo.getByRole('button', { name: 'Search' }).click();
          await frame('05-command-palette');

          await browser.close();
          NODE

          {
            for frame in /tmp/deep-browser-frames/*.png; do
              printf "file '%s'\n" "$frame"
              printf "duration 1.1\n"
            done
            printf "file '/tmp/deep-browser-frames/05-command-palette.png'\n"
          } > /tmp/deep-browser-frames/sequence.txt

          ffmpeg -y -f concat -safe 0 -i /tmp/deep-browser-frames/sequence.txt \
            -vf "fps=8,scale=960:-1:flags=lanczos,split[s0][s1];[s0]palettegen=max_colors=128[p];[s1][p]paletteuse=dither=bayer" \
            -loop 0 ../docs/images/chatbot-demo.gif

      - name: Commit showcase assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/chatbot-full-dark.png docs/images/chatbot-sidepanel-dark.png docs/images/chatbot-demo.gif
          git commit -m "docs: add dark UI screenshots and animated demo [skip showcase]"
          git push
