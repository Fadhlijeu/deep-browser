[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-browser"
version = "0.13.8"
description = "Personal local-first browser agent workstation (reworked from Browser Use)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Deep-Browser Contributors" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]

dependencies = [
    "aiofiles>=24.1.0",
    "aiohttp>=3.11.0",
    "anyio>=4.9.0",
    "backoff>=2.2.1",
    "browser-harness>=0.1.9",
    "browser-use-sdk>=3.4.0",
    "bubus>=1.5.0",
    "cdp-use>=1.4.5",
    "click>=8.1.7",
    "cloudpickle>=3.1.2",
    "fastapi>=0.111.0",
    "fetch-use>=0.4.0",
    "google-api-core>=2.25.0",
    "google-auth>=2.48.0",
    "google-genai>=0.1.0",
    "httpx>=0.27.0",
    "InquirerPy>=0.3.4",
    "markdownify>=1.2.2",
    "openai>=1.30.0",
    "anthropic>=0.28.0",
    "pillow>=12.0.0",
    "portalocker>=2.7.0",
    "posthog>=7.0.0",
    "psutil>=7.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.2.0",
    "pyotp>=2.9.0",
    "pypdf>=6.14.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.0",
    "reportlab>=4.4.0",
    "requests>=2.30.0",
    "rich>=13.7.0",
    "screeninfo>=0.8.1",
    "typing-extensions>=4.12.0",
    "uuid7>=0.1.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpserver>=1.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.4.0",
]

[project.scripts]
deep-browser = "browser_use.cli:cli"
browser-use = "browser_use.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["browser_use*", "deep_browser*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
